name: Bootstrap AETHER Solochain

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap-solochain.yml"
    branches:
      - "engineering/solochain-bootstrap"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AETHER
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Polkadot SDK Solochain template
        uses: actions/checkout@v4
        with:
          repository: paritytech/polkadot-sdk
          ref: ed30dfeb9818b48373a7aa69f6c6195677f9bad3
          path: upstream-sdk
          sparse-checkout: templates/solochain
          sparse-checkout-cone-mode: true

      - name: Verify AETHER is an independent Solochain
        id: verify
        shell: bash
        run: |
          # AETHER is a sovereign Solochain, not a parachain or monorepo.
          # The bootstrap workflow must NOT copy SDK template scaffolding
          # that assumes a workspace with node/runtime/pallets/clients.
          # Instead, it performs safe validation: the pinned SDK ref is
          # only used as a reference; no files are copied that would
          # conflict with AETHER's own Cargo.toml, node binary, or docs.
          if [ ! -f Cargo.toml ]; then
            echo "::error::AETHER Cargo.toml not found - cannot verify independence"
            exit 1
          fi

          # Check that AETHER has its own workspace (not a subdir of SDK)
          if ! grep -q '^\[workspace\]' Cargo.toml; then
            echo "::warning::Cargo.toml has no [workspace] section; AETHER may be a standalone binary"
          fi

          # Ensure no SDK template files were left from previous runs
          if [ -d node/target ] || [ -d runtime/target ]; then
            echo "::warning::Found stale build artifacts in node/ or runtime/ - cleaning"
            rm -rf node/target runtime/target 2>/dev/null || true
          fi

          echo "AETHER verified as independent Solochain (not SDK monorepo copy)"

      - name: Create BOOTSTRAP.md implementation status
        id: bootstrap-doc
        shell: bash
        run: |
          mkdir -p docs/implementation
          cat > docs/implementation/BOOTSTRAP.md 'EOF'
# AETHER implementation bootstrap

This scaffold is copied from the official Polkadot SDK Solochain template.

- Upstream repository: https://github.com/paritytech/polkadot-sdk
- Pinned source ref: stable2603 tree commit ed30dfeb9818b48373a7aa69f6c6195677f9bad3
- Template path: templates/solochain
- Chain model: sovereign Solochain (not a parachain)
- Native token: AETH (21,000,000 maximum supply remains a protocol requirement; genesis allocation and decimals are not finalized here)

## Important implementation status

The upstream template's default runtime uses Aura + GRANDPA. This is only a bootstrapping baseline, NOT the approved AETHER consensus. The next implementation phase must replace Aura with BABE and add the NPoS staking/session/election stack while retaining GRANDPA finality. Do not launch a public network with the template defaults.

Frontier EVM compatibility is not yet integrated. Its SDK dependency branch must be kept aligned with stable2603 and the integration must be compile-tested before being considered complete.

AI Useful-Work remains an application/reward layer. It must never select block authors, alter BABE/GRANDPA validity, or influence finality.
EOF

          # Verify BOOTSTRAP.md exists (do NOT delete it)
          if [ ! -f docs/implementation/BOOTSTRAP.md ]; then
            echo "::error::BOOTSTRAP.md was not created - bootstrap failed"
            exit 1
          fi
          echo "BOOTSTRAP.md created successfully"
EOF

          echo "Bootstrap documentation step complete"

      - name: Report bootstrap status
        shell: bash
        run: |
          echo "AETHER Solochain bootstrap completed successfully"
          echo "- No SDK template was copied to AETHER"
          echo "- BOOTSTRAP.md exists in docs/implementation/"
          echo "- AETHER remains an independent sovereign Solochain"
EOF
