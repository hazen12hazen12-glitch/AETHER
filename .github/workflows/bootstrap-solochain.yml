name: Bootstrap AETHER Solochain

on:
  workflow_dispatch:
  push:
    branches: [engineering/solochain-bootstrap]
    paths:
      - Cargo.toml
      - Cargo.lock
      - node/**
      - runtime/**
      - pallets/**
      - .github/workflows/bootstrap-solochain.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AETHER
        uses: actions/checkout@v4

      - name: Check root Cargo.toml exists
        run: test -f Cargo.toml || { echo "::error::root Cargo.toml is missing"; exit 1; }

      - name: Check Cargo.lock exists
        run: test -f Cargo.lock || { echo "::error::Cargo.lock is missing"; exit 1; }

      - name: Validate workspace members
        run: |
          MEMBERS=$(cargo metadata --locked --format-version 1 --no-deps 2>&1 | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(d.get('workspace_members',[])))")
          test -n "$MEMBERS" || { echo "::error::no workspace members found"; exit 1; }
          echo "workspace_members: $MEMBERS"

      - name: cargo check --workspace --locked
        run: cargo check --workspace --locked

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: Report passed
        if: success()
        run: echo "All Rust workspace validation steps passed"
