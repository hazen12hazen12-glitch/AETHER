name: Bootstrap AETHER Solochain

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap-solochain.yml"
    branches:
      - "engineering/solochain-bootstrap"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AETHER
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Polkadot SDK Solochain template
        uses: actions/checkout@v4
        with:
          repository: paritytech/polkadot-sdk
          ref: ed30dfeb9818b48373a7aa69f6c6195677f9bad3
          path: upstream-sdk
          sparse-checkout: templates/solochain
          sparse-checkout-cone-mode: true

      - name: Copy official Solochain template without deleting AETHER docs
        shell: bash
        run: |
          cp -R upstream-sdk/templates/solochain/. .
          rm -rf upstream-sdk
          find node runtime pallets env-setup -type f \( -name '*.rs' -o -name '*.toml' -o -name '*.md' \) -print0 | xargs -0 sed -i 's/solochain-template/aether/g'
          sed -i 's/solochain-template/aether/g' README.md
          mkdir -p docs/implementation
          cat > docs/implementation/BOOTSTRAP.md 'EOF'
          # AETHER implementation bootstrap
          This scaffold is copied from the official Polkadot SDK Solochain template.
          - Upstream repository: https://github.com/paritytech/polkadot-sdk
          - Pinned source ref: stable2603 tree commit ed30dfeb9818b48373a7aa69f6c6195677f9bad3
          - Template path: templates/solochain
          - Chain model: sovereign Solochain (not a parachain)
          - Native token: AETH (21,000,000 maximum supply remains a protocol requirement; genesis allocation and decimals are not finalized here)
          ## Important implementation status
          The upstream template's default runtime uses Aura + GRANDPA. This is only a bootstrapping baseline, NOT the approved AETHER consensus. The next implementation phase must replace Aura with BABE and add the NPoS staking/session/election stack while retaining GRANDPA finality. Do not launch a public network with the template defaults.
          Frontier EVM compatibility is not yet integrated. Its SDK dependency branch must be kept aligned with stable2603 and the integration must be compile-tested before being considered complete.
          AI Useful-Work remains an application/reward layer. It must never select block authors, alter BABE/GRANDPA validity, or influence finality.
          EOF
          rm docs/implementation/BOOTSTRAP.md

      - name: Derive workspace members from template
        shell: bash
        id: derive
        run: |
          ws_members=""
          if [ -f Cargo.toml ]; then
            members=$(grep -A 20 '^\[workspace\]' Cargo.toml | grep -A 20 'members' | grep -A 1 '^members' | grep '^ *"' | sed 's/^[[:space:]]*"//;s/".*//')
            deps=$(grep -A 50 '^\[workspace.dependencies\]' Cargo.toml | grep -A 50 '^\[' | grep -v '^\[' | grep '^[a-zA-Z]' | sed 's/=.*/ /' | tr '\n' ' ')
            if [ -n "$members" ]; then
              ws_members="$members"
            elif [ -n "$deps" ]; then
              ws_members=$(echo "$deps" | tr ' ' '\n' | sort -u | tr '\n' ' ')
            else
              echo "::warning::No workspace members or dependencies found; cannot form valid workspace"
              ws_members=""
            fi
          fi
          echo "ws_members=$ws_members" >> $GITHUB_OUTPUT

      - name: Create root Cargo.toml if workspace derivable
        shell: bash
        run: |
          if [ -n "${{ steps.derive.outputs.ws_members }}" ] && [ "${{ steps.derive.outputs.ws_members }}" != "No workspace members" ]; then
            members="${{ steps.derive.outputs.ws_members }}"
            cat > Cargo.toml 'EOF'
          [workspace]
          resolver = "2"
          members = [EOF
          echo "$members" | while read m; do echo "  \"$m\","; done >> Cargo.toml
          echo "]  >> Cargo.toml
          if [ -f upstream-sdk/templates/solochain/Cargo.toml ]; then
            grep -A 999 '^\[workspace.dependencies\]' upstream-sdk/Cargo.toml >> Cargo.toml
          fi
          EOF
          fi

      - name: Run cargo metadata check
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "cargo metadata succeeded"
          else
            echo "::error::cargo metadata failed - upstream workspace root is required to form a valid workspace"
            exit 1
          fi

      - name: Run cargo check if workspace is valid
        if: ${{ steps.derive.outputs.ws_members != '' }}
        shell: bash
        run: |
          if [ -f Cargo.toml ] && grep -q '^\[workspace\]' Cargo.toml; then
            cargo check --workspace
          else
            echo "::warning::No valid workspace Cargo.toml found; skipping cargo check"
            exit 1
          fi

      - name: Commit generated scaffold (only on success)
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No scaffold changes to commit"
          else
            git commit -m "Bootstrap AETHER from pinned Polkadot SDK Solochain template"
            git push origin HEAD
          fi
